ai_usage_summary: |
  Used Claude (Anthropic) for architecture design, code review, and implementation guidance.
  No candidate data was fed to any external LLM during ranking. The only model used during
  inference is sentence-transformers/all-MiniLM-L6-v2 (22MB, runs locally on CPU, pre-cached
  from HuggingFace Hub). Zero network calls are made during the ranking pipeline.

methodology_summary: |
  Two-stage hybrid pipeline:

  Stage 1 — Semantic Retrieval:
  sentence-transformers/all-MiniLM-L6-v2 encodes all candidate profiles into dense vectors.
  FAISS IndexFlatIP (exact inner product) retrieves top-3000 by embedding similarity.
  TF-IDF (scikit-learn, ngram 1-2, 8K features) retrieves top-3000 by lexical similarity.
  Both ranked lists are fused via Reciprocal Rank Fusion (RRF, k=60) into a ~1500-candidate pool.
  A title safety net ensures any candidate with a tier-1 ML/AI title is always included.

  Stage 2 — Rule-Based Hybrid Reranking:
  Seven evidence-grounded components, all weights configurable via config/scoring.yaml:
  - title/role alignment (25%): career history fraction in ML/AI titles
  - skill match (20%): proficiency-weighted, endorsement-boosted, assessment-validated
  - production evidence (15%): deployment keywords + scale mentions in career descriptions
  - behavioral availability (15%): recency, response rate, notice period, GitHub activity
  - experience fit (10%): ideal range 5-9 years with ramp curve
  - domain fit (10%): product company vs consulting firm career fraction
  - location fit (5%): Pune/Noida tier-1, Bangalore/Hyderabad tier-2

  Final: (0.75 × rule_score + 0.25 × embedding_sim) × (1 − penalty)

  Penalty multipliers: consulting-only −30%, wrong-domain −45%, CV-without-NLP −30%,
  job-hopping −10%, behaviorally-unavailable −20%, honeypot −95%.

  Honeypot detection (7 checks): career timeline overlaps, graduation/career start
  contradictions, stated-YOE vs actual span, all-expert-with-maxed-endorsements,
  all-behavioral-signals-at-maximum, duration-inflation, impossible education dates.

  Runtime: ~19s cold / ~6s cached for 2,000 candidates. Zero API calls.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
